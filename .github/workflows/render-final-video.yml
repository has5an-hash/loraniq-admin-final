name: One-off Reza video render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg and downloader
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade gdown

      - name: Download source assets from Google Drive
        run: |
          gdown --fuzzy "https://drive.google.com/file/d/1X6ruu0y_0DLnOo8bB3BVF0KxqV6qIO8v/view?usp=sharing" -O source.mp4
          gdown --fuzzy "https://drive.google.com/file/d/1GrOp993o8BTtvm4JosOD58MKpdt_PUtV/view?usp=sharing" -O song.mp3
          gdown --fuzzy "https://drive.google.com/file/d/1AXv9WRkqAbeabKzSCkZwExQdLxdQvAHG/view?usp=sharing" -O phone.png
          file source.mp4 song.mp3 phone.png
          test "$(stat -c%s source.mp4)" -gt 10000
          test "$(stat -c%s song.mp3)" -gt 10000
          test "$(stat -c%s phone.png)" -gt 1000

      - name: Render final video with animated phone timer and song-only audio
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def probe(args):
              raw = subprocess.check_output(["ffprobe", "-v", "error", *args, "-of", "default=noprint_wrappers=1:nokey=1"], text=True).strip().splitlines()
              return float(raw[0])

          video_duration = probe(["-select_streams", "v:0", "-show_entries", "stream=duration", "source.mp4"])
          audio_duration = probe(["-show_entries", "format=duration", "song.mp3"])
          still_duration = audio_duration - video_duration
          print(json.dumps({"source_video_seconds": video_duration, "song_seconds": audio_duration, "still_seconds": still_duration, "final_seconds": audio_duration}, indent=2))

          graph = r"""
          [0:v]fps=30,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,trim=duration=VIDEO_DUR,setpts=PTS-STARTPTS[v0];
          [1:v]split=2[bg0][fg0];
          [bg0]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,boxblur=32:16,eq=brightness=-0.28[bg];
          [fg0]drawbox=x=61:y=294:w=39:h=16:color=0x171923:t=fill,
          drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='%{eif\:trunc(min(262\,t+11)/60)\:d\:2}\:%{eif\:mod(trunc(min(262\,t+11))\,60)\:d\:2}':x=64:y=296:fontsize=10:fontcolor=white:borderw=0,
          drawbox=x=64:y=277:w=143:h=11:color=0x171923:t=fill,
          drawbox=x=68:y=282:w=135:h=1:color=0xa7aeb8:t=fill,
          drawbox=x=68+135*min(262\,t+11)/272-2:y=280:w=4:h=5:color=white:t=fill,
          scale=406:720:flags=lanczos,setsar=1[fg];
          [bg][fg]overlay=(W-w)/2:(H-h)/2:shortest=1,fps=30,trim=duration=STILL_DUR,setpts=PTS-STARTPTS[v1];
          [v0][v1]concat=n=2:v=1:a=0[vout];
          [2:a]atrim=duration=AUDIO_DUR,asetpts=PTS-STARTPTS[aout]
          """.replace("VIDEO_DUR", f"{video_duration:.6f}").replace("STILL_DUR", f"{still_duration:.6f}").replace("AUDIO_DUR", f"{audio_duration:.6f}")
          graph = ";".join(part.strip() for part in graph.split(";") if part.strip())

          cmd = [
              "ffmpeg", "-y",
              "-i", "source.mp4",
              "-loop", "1", "-framerate", "30", "-t", f"{still_duration:.6f}", "-i", "phone.png",
              "-i", "song.mp3",
              "-filter_complex", graph,
              "-map", "[vout]", "-map", "[aout]",
              "-t", f"{audio_duration:.6f}",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-pix_fmt", "yuv420p", "-r", "30",
              "-c:a", "aac", "-b:a", "192k",
              "-movflags", "+faststart",
              "reza_lahze_akhar_final.mp4"
          ]
          print("Running FFmpeg…")
          subprocess.run(cmd, check=True)
          subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration,size", "-show_entries", "stream=codec_type,width,height,duration", "-of", "json", "reza_lahze_akhar_final.mp4"], check=True)
          PY

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: reza-lahze-akhar-final
          path: reza_lahze_akhar_final.mp4
          if-no-files-found: error
          retention-days: 3
