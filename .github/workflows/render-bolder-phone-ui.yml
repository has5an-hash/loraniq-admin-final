name: Render corrected Nokia player timer and progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install media and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade gdown pillow opencv-python-headless

      - name: Download original sources
        run: |
          gdown "https://drive.google.com/uc?id=1X6ruu0y_0DLnOo8bB3BVF0KxqV6qIO8v" -O source.mp4
          gdown "https://drive.google.com/uc?id=1GrOp993o8BTtvm4JosOD58MKpdt_PUtV" -O song.mp3
          gdown "https://drive.google.com/uc?id=1AXv9WRkqAbeabKzSCkZwExQdLxdQvAHG" -O phone.png
          test "$(stat -c%s source.mp4)" -gt 10000
          test "$(stat -c%s song.mp3)" -gt 10000
          test "$(stat -c%s phone.png)" -gt 1000

      - name: Rebuild only the original player controls in place
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, json, math, subprocess
          import cv2
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          def probe(args):
              raw = subprocess.check_output(
                  ["ffprobe", "-v", "error", *args,
                   "-of", "default=noprint_wrappers=1:nokey=1"],
                  text=True
              ).strip().splitlines()
              return float(raw[0])

          video_duration = probe([
              "-select_streams", "v:0", "-show_entries", "stream=duration",
              "source.mp4"
          ])
          audio_duration = probe(["-show_entries", "format=duration", "song.mp3"])
          still_duration = audio_duration - video_duration
          if video_duration < 1 or still_duration <= 0 or audio_duration < 12:
              raise RuntimeError("Unexpected source duration")

          # Match the final frame exactly, then remove the screenshot's static
          # timer and static progress track from their REAL in-phone locations.
          original = Image.open("phone.png").convert("RGB")
          fitted = ImageOps.fit(original, (720, 1280), method=Image.Resampling.LANCZOS)
          arr = cv2.cvtColor(np.array(fitted), cv2.COLOR_RGB2BGR)
          mask = np.zeros((1280, 720), dtype=np.uint8)

          # The real progress line slopes down to the right with the phone's
          # perspective: from (174,720) to (544,744), inside the phone screen.
          cv2.line(mask, (174, 720), (544, 744), 255, 13, cv2.LINE_AA)
          cv2.circle(mask, (202, 724), 9, 255, -1)  # old playhead
          # Existing elapsed-time text only; preserve the total-duration 04:32.
          cv2.rectangle(mask, (160, 745), (245, 781), 255, -1)
          cleaned = cv2.inpaint(arr, mask, 5, cv2.INPAINT_TELEA)
          cleaned_rgb = cv2.cvtColor(cleaned, cv2.COLOR_BGR2RGB)
          Image.fromarray(cleaned_rgb).save("phone-base-fixed.png")

          # Animate a transparent overlay confined to the original player UI.
          # The line and timer are drawn in the same perspective and at the
          # correct screen coordinates (not added at the bottom of the video).
          W, H, FPS = 420, 80, 24
          frame_count = round(still_duration * FPS)
          overlay_cmd = [
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "rawvideo", "-pixel_format", "rgba",
              "-video_size", f"{W}x{H}", "-framerate", str(FPS),
              "-i", "pipe:0", "-an", "-c:v", "qtrle", "-pix_fmt", "argb",
              "player-overlay.mov"
          ]
          proc = subprocess.Popen(overlay_cmd, stdin=subprocess.PIPE)
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 26)
          total_duration = 4 * 60 + 32  # fixed right-hand total-time label in source
          initial_ratio = (202 - 174) / (544 - 174)  # match original playhead
          final_ratio = min(1.0, audio_duration / total_duration)
          try:
              for i in range(frame_count):
                  t = i / FPS
                  player_seconds = 11 + (audio_duration - 11) * min(1.0, t / still_duration)
                  elapsed = int(player_seconds)
                  elapsed_ratio = min(1.0, max(0.0, (player_seconds - 11) / max(audio_duration - 11, 1e-6)))
                  ratio = initial_ratio + elapsed_ratio * (final_ratio - initial_ratio)

                  frame = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  draw = ImageDraw.Draw(frame)

                  # Progress track and fill follow the slanted line in the photo.
                  x0, y0, x1, y1 = 14, 14, 384, 38
                  xhead = x0 + (x1 - x0) * ratio
                  yhead = y0 + (y1 - y0) * ratio
                  draw.line((x0, y0, x1, y1), fill=(89, 99, 111, 255), width=6)
                  draw.line((x0, y0, xhead, yhead), fill=(145, 197, 225, 255), width=6)
                  # Recreate the small in-player seek knob.
                  r = 8
                  draw.ellipse((xhead-r, yhead-r, xhead+r, yhead+r),
                               fill=(151, 199, 222, 255),
                               outline=(239, 247, 252, 255), width=3)

                  # Elapsed timer at original left-side label position. Rotate
                  # subtly to follow the phone's photographed perspective.
                  timer = f"{elapsed // 60:02d}:{elapsed % 60:02d}"
                  bbox = draw.textbbox((0, 0), timer, font=font)
                  tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
                  text_layer = Image.new("RGBA", (tw + 8, th + 8), (0, 0, 0, 0))
                  td = ImageDraw.Draw(text_layer)
                  td.text((4 - bbox[0], 4 - bbox[1]), timer, font=font,
                          fill=(255, 255, 255, 255), stroke_width=1, stroke_fill=(18, 24, 32, 210))
                  text_layer = text_layer.rotate(-4, resample=Image.Resampling.BICUBIC, expand=True)
                  # Place timer centered over the original 00:11 glyphs.
                  px = round(44 - text_layer.width / 2)
                  py = round(58 - text_layer.height / 2)
                  frame.alpha_composite(text_layer, (px, py))
                  proc.stdin.write(frame.tobytes())
              proc.stdin.close()
          except Exception:
              if proc.stdin and not proc.stdin.closed:
                  proc.stdin.close()
              proc.kill()
              raise
          if proc.wait() != 0:
              raise RuntimeError("Could not encode in-place phone UI overlay")

          graph = f"""
          [0:v]fps=24,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,setsar=1/1,trim=duration={video_duration:.6f},setpts=PTS-STARTPTS[v0];
          [1:v]fps=24,trim=duration={still_duration:.6f},setpts=PTS-STARTPTS[base];
          [3:v]fps=24,format=rgba[ov];
          [base][ov]overlay=x=160:y=706:eof_action=pass:shortest=1:format=auto,trim=duration={still_duration:.6f},setpts=PTS-STARTPTS[v1];
          [v0][v1]concat=n=2:v=1:a=0,setsar=1/1[vout];
          [2:a]atrim=duration={audio_duration:.6f},asetpts=PTS-STARTPTS[aout]
          """
          graph = ";".join(part.strip() for part in graph.split(";") if part.strip())
          cmd = [
              "ffmpeg", "-y",
              "-i", "source.mp4",
              "-loop", "1", "-framerate", "24", "-t", f"{still_duration:.6f}", "-i", "phone-base-fixed.png",
              "-i", "song.mp3",
              "-i", "player-overlay.mov",
              "-filter_complex", graph,
              "-map", "[vout]", "-map", "[aout]",
              "-t", f"{audio_duration:.6f}",
              "-c:v", "libx264", "-preset", "ultrafast", "-crf", "19",
              "-pix_fmt", "yuv420p", "-r", "24",
              "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart",
              "reza_lahze_akhar_inplayer_bolder.mp4"
          ]
          print("RENDER_CONFIG", json.dumps({
              "elapsed_timer_start": "00:11",
              "elapsed_timer_end": "04:22",
              "fixed_total_label": "04:32",
              "progress_line_start": [174, 720],
              "progress_line_end": [544, 744],
              "timer_center": [204, 764],
              "video_seconds": video_duration,
              "audio_seconds": audio_duration,
              "still_seconds": still_duration,
              "frames": frame_count
          }))
          subprocess.run(cmd, check=True)

          info = subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration,size",
              "-show_entries", "stream=codec_type,width,height,duration",
              "-of", "json", "reza_lahze_akhar_inplayer_bolder.mp4"
          ], text=True)
          meta = json.loads(info)
          print("FINAL_METADATA", info)
          v = next(s for s in meta["streams"] if s["codec_type"] == "video")
          if int(v["width"]) != 720 or int(v["height"]) != 1280:
              raise RuntimeError("Wrong video dimensions")
          if abs(float(meta["format"]["duration"]) - audio_duration) > 1.0:
              raise RuntimeError("Output duration differs from song")
          PY

      - name: Inspect the actual rendered player area
        run: |
          for spec in "10.5 start" "90 middle" "260 end"; do
            set -- $spec
            ffmpeg -y -hide_banner -loglevel error -ss "$1" -i reza_lahze_akhar_inplayer_bolder.mp4 -vf "crop=420:100:150:700,scale=840:200" -frames:v 1 "preview_$2.jpg"
          done
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ["start","middle","end"]:
              p=Path(f"preview_{name}.jpg")
              print(f"PLAYER_PREVIEW_{name.upper()}_BASE64="+base64.b64encode(p.read_bytes()).decode("ascii"))
          PY

      - name: Publish corrected video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reza-inplayer-bolder-${GITHUB_RUN_ID}"
          gh release create "$TAG" reza_lahze_akhar_inplayer_bolder.mp4 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Reza — Lahze Akhar (bolder in-player controls)" \
            --notes "Final refinement: elapsed timer uses a slightly larger bold white typeface in its original phone position; the in-phone progress line is thicker/brighter and its playhead larger, all animated in sync. Right-side total duration remains 04:32. Opening video preserved, source clip audio muted, song only." \
            --latest=false
